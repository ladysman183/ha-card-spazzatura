alias: "Raccolta Rifiuti: Promemoria Serale"
description: "Invia notifica serale ed attiva lo stato di promemoria se c'è spazzatura da portare fuori."
trigger:
  - trigger: time
    at: "20:00:00"
condition:
  - condition: template
    value_template: "{{ states('sensor.spazzatura_domani') not in ['Nessuno', 'none', 'unavailable', 'unknown'] }}"
action:
  - action: notify.notify
    data:
      title: "Raccolta Differenziata 🗑️"
      message: "Ricordati di portare fuori: {{ states('sensor.spazzatura_domani') }}"
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.spazzatura_da_portare_fuori
mode: single
